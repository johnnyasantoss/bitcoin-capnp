[package]
name = "tui"
version = "0.1.0"
edition = "2021"
default-run = "tui"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
bitcoin-capnp = { path = "../.." }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
tokio = {
  version = "1",
  features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
  ]
}
tokio-util = { version = "0.7", features = ["compat"] }
