[package]
name = "bitcoin-ipc"
description = "A Rust client library for Bitcoin Core's IPC (inter-process communication) interface"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Stratum V2 Developers"]
homepage = "https://stratumprotocol.org"
keywords = ["bitcoin", "bitcoin-core", "mining", "stratum"]

[dependencies]
capnp = "0.21.4"
capnp-rpc = "0.21.0"
bitcoin = "0.32.7"
tokio = { version = "1.44.1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7.10", features = ["compat"] }
thiserror = "2"
tracing = "0.1.41"

[dev-dependencies]
tracing-subscriber = "0.3.19"

[build-dependencies]
capnpc = "0.21.2"
