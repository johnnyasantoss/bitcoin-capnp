[package]
description = "A Rust client library for Bitcoin Core's Capnp (inter-process communication) interface"
documentation = "https://docs.rs/bitcoin-capnp"
edition = "2024"
homepage = "https://stratumprotocol.org"
keywords = ["bitcoin", "bitcoin-core", "mining", "stratum"]
license = "Unlicense OR MIT"
name = "bitcoin-capnp"
repository = "https://github.com/johnnyasantoss/bitcoin-capnp.git"
version = "0.1.0"

[dependencies]
bitcoin = "0.32.7"
capnp = "0.21.7"
capnp-rpc = "0.21.0"
thiserror = "2"
tokio = {
  version = "1.44.1",
  features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
  ]
}
tokio-util = { version = "0.7.10", features = ["compat"] }
tracing = "0.1.41"

[dev-dependencies]
tracing-subscriber = "0.3.19"

[build-dependencies]
capnpc = "0.21.2"
